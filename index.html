<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

  <!-- Pengaturan layar untuk HP Android dan iPhone -->

  <meta name="viewport"

    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <title>Undangan Pernikahan</title>

  <style>

    /* =========================================

       1. PENGATURAN DASAR

       ========================================= */

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }

    html {

      scroll-behavior: smooth;

      scroll-snap-type: y proximity;

      -webkit-text-size-adjust: 100%;

    }

    body {

      font-family: sans-serif;

      background: #fff;

      color: #222;

      overflow-x: hidden;

      -webkit-text-size-adjust: 100%;

    }

    button {

      font: inherit;

      cursor: pointer;

      touch-action: manipulation;

    }

    /* =========================================

       2. STRUKTUR SEMUA SECTION

       Setiap halaman memenuhi tinggi layar.

       ========================================= */

    .page {

      position: relative;

      isolation: isolate;

      overflow: hidden;

      width: 100%;

      height: 100vh;

      height: 100svh;

      min-height: 100vh;

      min-height: 100svh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 24px;

      padding-bottom: calc(100px + env(safe-area-inset-bottom));

      background: #eee;

      scroll-snap-align: start;

    }

    /* =========================================

       3. BACKGROUND VIDEO DAN GAMBAR

       Video memenuhi layar tanpa mengubah rasio.

       ========================================= */

    .bg-video,

    .bg-image {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      object-position: center;

      pointer-events: none;

    }

    /* Gambar berada di belakang video.

       Jika video gagal, gambar tetap terlihat

       jika tersedia untuk section tersebut. */

    .bg-image {

      z-index: -2;

    }

    .bg-video {

      z-index: -1;

    }

    /* Isi section berada di atas background */

    .content {

      position: relative;

      z-index: 1;

      width: 100%;

      max-width: 600px;

      text-align: center;

    }

    /* =========================================

       4. COVER SECTION 1

       Hanya menampilkan tombol buka undangan.

       ========================================= */

.cover-button {
  display: inline-block;

  /* Geser posisi tombol ke bawah */
  position: relative;
  top: 300px;

  padding: 14px 24px;

  border: 1px solid #555;
  border-radius: 6px;

  background: #fff;
  color: #222;

  text-decoration: none;
}

    }

    /* =========================================

       5. SECTION 5: LOKASI DAN COUNTDOWN

       ========================================= */

    .event-info {

      margin-top: 20px;

      line-height: 1.8;

    }

    .location-button {

      display: inline-block;

      margin-top: 12px;

      padding: 10px 18px;

      background: #fff;

      color: #222;

      border: 1px solid #555;

      border-radius: 6px;

      text-decoration: none;

    }

    .countdown-container {

      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 8px;

      margin-top: 24px;

    }

    .countdown-item {

      min-width: 58px;

      padding: 10px 6px;

      border: 1px solid #777;

      border-radius: 6px;

      background: rgba(255, 255, 255, 0.85);

    }

    .countdown-number {

      display: block;

      font-size: 22px;

      font-weight: bold;

    }

    .countdown-label {

      display: block;

      margin-top: 4px;

      font-size: 12px;

    }

    #status-acara {

      margin-top: 18px;

      line-height: 1.6;

    }

    /* =========================================

       6. SECTION 7: GIFT / AMPLOP DIGITAL

       ========================================= */

    .gift-button {

      display: inline-block;

      margin-top: 16px;

      padding: 12px 20px;

      background: #fff;

      color: #222;

      border: 1px solid #555;

      border-radius: 6px;

    }

    .gift-info {

      margin-top: 16px;

      line-height: 1.8;

      overflow-wrap: anywhere;

    }

    /* =========================================

       7. TOMBOL MUSIK

       ========================================= */

    .music-button {

      position: fixed;

      z-index: 100;

      top: calc(16px + env(safe-area-inset-top));

      right: 16px;

      width: 44px;

      height: 44px;

      border: 1px solid #ddd;

      border-radius: 50%;

      background: #fff;

    }

    /* =========================================

       8. NAVIGASI BAWAH TENGAH

       Ikon menggunakan file SVG lokal.

       ========================================= */

    .bottom-nav {

      position: fixed;

      z-index: 100;

      left: 50%;

      bottom: calc(12px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      padding: 8px 12px;

      border: 1px solid #ddd;

      border-radius: 12px;

      background: rgba(255, 255, 255, 0.95);

    }

    .nav-button {

      width: 42px;

      height: 42px;

      display: flex;

      align-items: center;

      justify-content: center;

      border: none;

      border-radius: 8px;

      background: transparent;

    }

    .nav-button img {

      width: 24px;

      height: 24px;

      object-fit: contain;

    }

    @media (max-width: 360px) {

      .page {

        padding-left: 14px;

        padding-right: 14px;

      }

      .countdown-container {

        gap: 5px;

      }

      .countdown-item {

        min-width: 52px;

      }

      .countdown-number {

        font-size: 19px;

      }

      .bottom-nav {

        gap: 4px;

      }

    }

  </style>

</head>

<body>

  <!-- =========================================

       SECTION 1: COVER

       Background video: 1.mp4

       Hanya ada tombol buka undangan.

       Klik tombol menuju section 2.

       ========================================= -->

  <section class="page" id="cover">

    <video class="bg-video" autoplay muted loop playsinline>

      <source src="1.mp4" type="video/mp4">

    </video>

    <div class="content">

      <button class="cover-button" type="button"

        onclick="bukaUndangan()">

        Buka Undangan

      </button>

    </div>

  </section>

  <!-- =========================================

       SECTION 2: KOSONG

       Background video: 2.mp4

       Tidak ada teks atau elemen tambahan.

       ========================================= -->

  <section class="page" id="section-2">

    <video class="bg-video" autoplay muted loop playsinline>

      <source src="2.mp4" type="video/mp4">

    </video>

  </section>

  <!-- =========================================

       SECTION 3: KOSONG

       Background video: 3.mp4

       ========================================= -->

  <section class="page" id="section-3">

    <video class="bg-video" autoplay muted loop playsinline>

      <source src="3.mp4" type="video/mp4">

    </video>

  </section>

  <!-- =========================================

       SECTION 4: KOSONG

       Background video: 4.mp4

       ========================================= -->

  <section class="page" id="section-4">

    <video class="bg-video" autoplay muted loop playsinline>

      <source src="4.mp4" type="video/mp4">

    </video>

  </section>

  <!-- =========================================

       SECTION 5: LOKASI DAN COUNTDOWN

       Background gambar: 1.jpg

       Ganti tanggal, waktu, alamat, dan link Maps.

       ========================================= -->

  <section class="page" id="lokasi-countdown">

    <img class="bg-image" src="1.jpg" alt="">

    <div class="content">

      <h2>Lokasi Acara</h2>

      <div class="event-info">

        <p>Selasa, 8 Desember 2026</p>

        <p>Pukul 08.00 WIB</p>

        <p>Desa Randu, Pecalungan</p>

        <!-- Ganti URL di bawah dengan link Google Maps -->

        <a class="location-button"

          href="https://maps.app.goo.gl/Pz9vsRHdTkM5Eeb3A"

          target="_blank"

          rel="noopener noreferrer">

          <img src="location.svg" alt=""

            style="width:16px;height:16px;vertical-align:middle;">

          Lihat Lokasi

        </a>

      </div>

      <h2 style="margin-top:28px;">

        Countdown Acara

      </h2>

      <div class="countdown-container">

        <div class="countdown-item">

          <span class="countdown-number" id="hari">0</span>

          <span class="countdown-label">Hari</span>

        </div>

        <div class="countdown-item">

          <span class="countdown-number" id="jam">00</span>

          <span class="countdown-label">Jam</span>

        </div>

        <div class="countdown-item">

          <span class="countdown-number" id="menit">00</span>

          <span class="countdown-label">Menit</span>

        </div>

        <div class="countdown-item">

          <span class="countdown-number" id="detik">00</span>

          <span class="countdown-label">Detik</span>

        </div>

      </div>

      <p id="status-acara" aria-live="polite">

        Menghitung waktu menuju acara...

      </p>

    </div>

  </section>

  <!-- =========================================

       SECTION 6: KOSONG

       Background video: 5.mp4

       ========================================= -->

  <section class="page" id="section-6">

    <video class="bg-video" autoplay muted loop playsinline>

      <source src="5.mp4" type="video/mp4">

    </video>

  </section>

  <!-- =========================================

       SECTION 7: GIFT / AMPLOP DIGITAL

       Background video: 7.mp4

       Tombol menyalin nomor rekening.

       ========================================= -->

  <section class="page" id="gift">

    <video class="bg-video" autoplay muted loop playsinline>

      <source src="7.mp4" type="video/mp4">

    </video>

    <div class="content">

      <h2>Wedding Gift</h2>

      <div class="gift-info">

        <p>Bank: Seabank</p>

        <p>Nomor rekening:</p>

        <p id="nomor-rekening">901168885116</p>

        <p>Atas nama: Anis Mufidah</p>

        <button class="gift-button" type="button"

          onclick="salinRekening()">

          Salin Nomor Rekening

        </button>

        <p id="status-salin" aria-live="polite"></p>

      </div>

    </div>

  </section>

  <!-- =========================================

       SECTION 8: PENUTUP

       Background video: 9.mp4

       ========================================= -->

  <section class="page" id="penutup">

    <video class="bg-video" autoplay muted loop playsinline>

      <source src="9.mp4" type="video/mp4">

    </video>

    <div class="content">

      <h2></h2>

    </div>

  </section>

  <!-- =========================================

       AUDIO MUSIK BACKGROUND

       File music.mp3 berada satu folder.

       ========================================= -->

  <audio id="musik-latar" loop preload="none">

    <source src="music.mp3" type="audio/mpeg">

  </audio>

  <button class="music-button" id="tombol-musik"

    type="button" onclick="toggleMusik()"

    aria-label="Putar musik" aria-pressed="false">

    <span id="ikon-musik">▶</span>

  </button>

  <!-- =========================================

       NAVIGASI BAWAH TENGAH

       Ikon SVG disimpan di folder yang sama.

       ========================================= -->

  <nav class="bottom-nav" aria-label="Navigasi undangan">

    <button class="nav-button" type="button"

      aria-label="Cover" onclick="keSection('cover')">

      <img src="home.svg" alt="">

    </button>

    <button class="nav-button" type="button"

      aria-label="Lokasi acara"

      onclick="keSection('lokasi-countdown')">

      <img src="location.svg" alt="">

    </button>

    <button class="nav-button" type="button"

      aria-label="Gift" onclick="keSection('gift')">

      <img src="gift.svg" alt="">

    </button>

    <button class="nav-button" type="button"

      aria-label="Penutup" onclick="keSection('penutup')">

      <img src="close.svg" alt="">

    </button>

  </nav>

  <!-- =========================================

       JAVASCRIPT

       Mengatur navigasi, countdown, musik,

       dan salin rekening.

       ========================================= -->

  <script>

    /* 1. TOMBOL BUKA UNDANGAN

       Langsung menuju section kedua. */

    function bukaUndangan() {

      keSection("section-2");

      // Mencoba memulai musik setelah interaksi.

      const audio = document.getElementById("musik-latar");

      if (audio.paused) {

        audio.play()

          .then(perbaruiTombolMusik)

          .catch(perbaruiTombolMusik);

      }

    }

    /* 2. NAVIGASI ANTAR SECTION */

    function keSection(id) {

      const section = document.getElementById(id);

      if (section) {

        section.scrollIntoView({

          behavior: "smooth",

          block: "start"

        });

      }

    }

    /* 3. COUNTDOWN ACARA

       Tanggal acara: 8 Desember 2026 pukul 08.00 WIB. */

    const waktuAcara = new Date(

      "2026-12-08T08:00:00+07:00"

    ).getTime();

    function perbaruiCountdown() {

      const sisa = waktuAcara - Date.now();

      const hari = document.getElementById("hari");

      const jam = document.getElementById("jam");

      const menit = document.getElementById("menit");

      const detik = document.getElementById("detik");

      const status = document.getElementById("status-acara");

      // Angka tetap tampil dan status berubah

      // ketika tanggal acara sudah terlewati.

      if (sisa <= 0) {

        hari.textContent = "0";

        jam.textContent = "00";

        menit.textContent = "00";

        detik.textContent = "00";

        status.textContent = "Acara telah selesai";

        return;

      }

      hari.textContent = Math.floor(

        sisa / (1000 * 60 * 60 * 24)

      );

      jam.textContent = String(

        Math.floor(

          (sisa % (1000 * 60 * 60 * 24)) /

          (1000 * 60 * 60)

        )

      ).padStart(2, "0");

      menit.textContent = String(

        Math.floor(

          (sisa % (1000 * 60 * 60)) /

          (1000 * 60)

        )

      ).padStart(2, "0");

      detik.textContent = String(

        Math.floor(

          (sisa % (1000 * 60)) / 1000

        )

      ).padStart(2, "0");

      status.textContent =

        "Menghitung waktu menuju acara.";

    }

    perbaruiCountdown();

    setInterval(perbaruiCountdown, 1000);

    /* 4. MUSIK PLAY / PAUSE */

    const audioMusik = document.getElementById(

      "musik-latar"

    );

    function perbaruiTombolMusik() {

      const ikon = document.getElementById("ikon-musik");

      const tombol = document.getElementById("tombol-musik");

      if (audioMusik.paused) {

        ikon.textContent = "▶";

        tombol.setAttribute("aria-label", "Putar musik");

        tombol.setAttribute("aria-pressed", "false");

      } else {

        ikon.textContent = "Ⅱ";

        tombol.setAttribute("aria-label", "Jeda musik");

        tombol.setAttribute("aria-pressed", "true");

      }

    }

    async function toggleMusik() {

      try {

        if (audioMusik.paused) {

          await audioMusik.play();

        } else {

          audioMusik.pause();

        }

      } catch (error) {

        console.error("Musik tidak bisa diputar:", error);

      }

      perbaruiTombolMusik();

    }

    audioMusik.addEventListener("play", perbaruiTombolMusik);

    audioMusik.addEventListener("pause", perbaruiTombolMusik);

    /* 5. SALIN NOMOR REKENING

       Ganti nomor contoh sesuai rekening asli. */

    async function salinRekening() {

      const nomor = document.getElementById(

        "nomor-rekening"

      ).textContent.trim();

      const status = document.getElementById("status-salin");

      try {

        await navigator.clipboard.writeText(nomor);

        status.textContent = "Nomor rekening berhasil disalin.";

      } catch (error) {

        // Fitur clipboard umumnya membutuhkan HTTPS.

        status.textContent =

          "Gagal menyalin otomatis. Silakan salin nomor secara manual.";

      }

    }

    /* 6. PERIKSA VIDEO

       Jika file video gagal dimuat, section tetap

       menampilkan warna latar. */

    document.querySelectorAll(".bg-video").forEach(

      function(video) {

        video.addEventListener("error", function() {

          console.warn(

            "Video tidak dapat dimuat:",

            video.querySelector("source")?.getAttribute("src")

          );

        });

      }

    );

    /* 7. SINKRONKAN STATUS TOMBOL MUSIK */

    perbaruiTombolMusik();

  </script>

</body>

</html>
